name: Builds
# Heavy builds: every machine toplevel + the docs site. MANUAL ONLY
# (org rule): the only automatic push workflow is ci.yml's flake check.
# Dispatch from Actions → Builds → Run workflow, or:
#   gh workflow run builds.yml --repo external-systems/home
#
# Each machine is its own job calling the org's reusable
# nixos-machine-build workflow — `uses:` jobs cannot have a matrix, so
# one job per machine. With count=1 runner these serialize anyway; when
# the fleet gains capacity they build in parallel.
permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-nixos:
    uses: external-systems/actions/.github/workflows/nixos-machine-build.yml@v1
    with:
      host: nixos

  build-kamrui-h1:
    uses: external-systems/actions/.github/workflows/nixos-machine-build.yml@v1
    with:
      host: kamrui-h1

  build-ghost:
    uses: external-systems/actions/.github/workflows/nixos-machine-build.yml@v1
    with:
      host: ghost

  build-hp-notebook:
    uses: external-systems/actions/.github/workflows/nixos-machine-build.yml@v1
    with:
      host: hp-notebook

  build-nixos-installer:
    uses: external-systems/actions/.github/workflows/nixos-machine-build.yml@v1
    with:
      host: nixos-installer

  build-docs:
    uses: external-systems/actions/.github/workflows/nix-build.yml@v1
    with:
      installable: .#documentation
      build-flags: --show-trace -L
