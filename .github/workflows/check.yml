# nix flake check on every push to main and on pull requests, and nothing
# else: no deploys, no other secrets. The only thing written is the Nix
# store cache (see "Nix store cache" below).
#
# Who can run it:
#   - pull_request (never pull_request_target): a PR from a fork runs
#     without repository secrets, so it can't read the private secrets
#     input or any token.
#   - The job only starts for PRs opened by the repository owner, org
#     members or collaborators. Everyone else's PR is skipped.
#   - Also set Settings > Actions > General > "Approval for running fork
#     pull request workflows from contributors" to "Require approval for
#     all external contributors", so a fork PR waits for you even before
#     this filter runs.
#
# NIX_GITHUB_TOKEN (repository secret): a fine-grained token with
# read-only Contents access to external-systems/secrets (the private
# values input; the other inputs are public). nix fetches github: inputs
# through the API, which ignores git credentials, so the token goes in as
# nix's access-tokens.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # cache-nix-action deletes this branch's superseded store caches.
  actions: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.NIX_GITHUB_TOKEN }}
      # Nix store cache: restores /nix/store from the GitHub Actions cache
      # (10 GB per repo, least recently used evicted), so inputs and
      # already-built checks aren't fetched or rebuilt every run.
      #   - Key: hash of flake.lock and the .nix files. On a miss, the
      #     newest nix-Linux-* cache is restored instead, which still
      #     covers almost everything.
      #   - Saved only by main pushes and manual runs: PRs read main's
      #     cache (and their base branch's) but don't write their own, so
      #     one cache stays well under the 10 GB limit.
      #   - The store is GC'd to 5 GB before saving, and main's older
      #     caches are purged, keeping only the current key.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: ${{ github.event_name != 'pull_request' }}
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: nix flake check
        run: nix flake check --keep-going --print-build-logs
