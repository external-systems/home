name: Release
# FlakeHub-style rolling semver: 0.<rolling-minor>.<commits-since-init>
# (home is on 0.3.x — bump ROLLING_MINOR when the convention rolls).
# The push path delegates to the org's reusable workflow
# (external-systems/actions/.github/workflows/nix-flake-check-and-tag.yml@v1).
#
# Two behaviors:
#   push to main        → nix flake check gates a rolling-semver tag:
#                         only a green push is tagged 0.3.<count> (tag
#                         push does not retrigger — workflows filter on
#                         branches: [main], and GITHUB_TOKEN pushes
#                         emit no events).
#   workflow_dispatch   → release job: pre-flight flake check, then a
#                         GitHub release for the given tag (default:
#                         latest 0.3.* tag). The release job stays local —
#                         it is repo-specific (gh release, --latest
#                         semantics), not part of the reusable set.
permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish as a GitHub release (default: latest)"
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  ROLLING_MINOR: "3"

jobs:
  check-and-tag:
    if: github.event_name == 'push'
    uses: external-systems/actions/.github/workflows/nix-flake-check-and-tag.yml@v1
    with:
      rolling-minor: ${{ env.ROLLING_MINOR }}

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, external-systems]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Pre-flight Flake Check
        run: nix flake check --show-trace -L

      - name: Resolve tag
        id: semver
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git tag -l "0.${ROLLING_MINOR}.*" --sort=-version:refname | head -1)
          fi
          [ -n "$TAG" ] || { echo "No 0.${ROLLING_MINOR}.* tag found." >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing: $TAG"

      - name: Create GitHub release
        # gh is baked into the runner image — no marketplace action needed.
        # --latest lets rolling tags supersede each other as "latest".
        run: gh release create "${{ steps.semver.outputs.tag }}" --title "${{ steps.semver.outputs.tag }}" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
