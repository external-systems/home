name: Release
# FlakeHub-style rolling semver: 0.<rolling-minor>.<commits-since-init>
# (home is on 0.3.x — bump ROLLING_MINOR when the convention rolls).
#
# Two behaviors:
#   push to main        → tag job: every push gets tagged 0.3.<count>
#                         automatically (tag push does not retrigger —
#                         workflows filter on branches: [main]).
#   workflow_dispatch   → release job: pre-flight flake check, then a
#                         GitHub release for the given tag (default:
#                         latest 0.3.* tag).
permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish as a GitHub release (default: latest)"
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  ROLLING_MINOR: "3"

jobs:
  tag:
    if: github.event_name == 'push'
    runs-on: [self-hosted, external-systems]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          # Full history: the patch number is the commit count since init.
          fetch-depth: 0

      - name: Tag 0.${{ env.ROLLING_MINOR }}.<commit-count>
        run: |
          TAG="0.${ROLLING_MINOR}.$(git rev-list --count HEAD)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "${{ github.sha }}"
          git push origin "$TAG"
          echo "Tagged ${{ github.sha }} as $TAG"

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, external-systems]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Pre-flight Flake Check
        run: nix flake check --show-trace -L

      - name: Resolve tag
        id: semver
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git tag -l "0.${ROLLING_MINOR}.*" --sort=-version:refname | head -1)
          fi
          [ -n "$TAG" ] || { echo "No 0.${ROLLING_MINOR}.* tag found." >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing: $TAG"

      - name: Create GitHub release
        # gh is baked into the runner image — no marketplace action needed.
        # --latest lets rolling tags supersede each other as "latest".
        run: gh release create "${{ steps.semver.outputs.tag }}" --title "${{ steps.semver.outputs.tag }}" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
