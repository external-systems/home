name: VM Tests
# NixOS VM tests on the self-hosted runner (kamrui-h1: 30 GiB RAM,
# Ryzen 7 6800H 8c/16t, KVM). MANUAL ONLY (org rule) — VM tests never
# run automatically. Dispatch from Actions → VM Tests → Run workflow, or:
#   gh workflow run vm-tests.yml --repo external-systems/home [-f size=md]
#
# Why this file stays local instead of calling the org's reusable
# nixos-vm-test.yml: `uses:` jobs cannot have a matrix, and this
# workflow dynamically discovers every vm-tests/*.nix into one.
# The reusable workflow covers single-test dispatch for other repos
# (and one-off runs here):
#   jobs:
#     vm-test:
#       uses: external-systems/actions/.github/workflows/nixos-vm-test.yml@v1
#       with: { test: <name>, size: sm }
#
# RESOURCE RULE: tests run on a desktop that is in use. The
# checks.vm-test-resources gate (part of nix flake check) rejects any
# vm-tests/*.nix declaring memorySize > 16384 MiB or cores > 8 PER VM;
# undeclared means the safe nixosTest defaults (1024 MiB, 1 core). Keep
# node-count × memorySize well under 30 GiB. CI runs the sm variant by
# default — md/lg exist for local runs on idle hardware.
#
# The runner user is in the kvm group and /dev/kvm is exposed to the nix
# build sandbox, so tests run under KVM — never TCG.
#
# Mode: sandboxed (`nix run .#vm-test -- <name>-<size>`) — the test driver
# runs inside the nix build sandbox and -L streams the FULL driver log
# (every VM's console output, every wait_for_* step) into the job log.
# A red job is therefore fully debuggable from the log alone:
#   gh run view --log-failed
# For interactive post-mortem (screenshots, junit.xml, resumable VM
# state) run driver mode locally:
#   nix run .#vm-test -- <name>-sm --driver
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      size:
        description: "Test size variant (sm gates expensive phases; md/lg are for idle hardware)"
        required: true
        default: "sm"
        type: choice
        options: [sm, md, lg]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  list:
    # Discover the chosen variant of every auto-discovered vm-tests/*.nix
    # so the matrix always matches the tree — no names to maintain here.
    runs-on: [self-hosted, external-systems]
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: List VM tests
        id: list
        run: |
          tests=$(nix eval --json .#legacyPackages.x86_64-linux.vmTests --apply 'builtins.attrNames' \
            | jq -c 'map(select(endswith("-${{ inputs.size }}"))) | sort')
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "Discovered: $tests"

  test:
    needs: list
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.list.outputs.tests) }}
    runs-on: [self-hosted, external-systems]
    # KVM + VM boot: generous ceiling; the vm-test app has its own
    # internal watchdog (default 3900s) that kills hung runs first.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Run ${{ matrix.test }}
        run: nix run .#vm-test -- ${{ matrix.test }}
