site_name: Andrew's Home Monorepo
site_author: Andrew Thomas Lee
site_url: https://home.andrewlee.fun
repo_url: https://github.com/andrewthomaslee/home
repo_name: andrewthomaslee/home

nav:
  - Home: index.md
  - Presentation: presentation.md
  - Architecture:
      - Overview: architecture/index.md
      - ADR 0001 - Multi-Host Deployment: architecture/adr/0001-multi-host-deployment-strategy.md
  - Harness:
      - Overview: harness/index.md
      - MCP Servers: harness/mcp-servers.md
      - Skills: harness/skills.md
      - Headroom (Context Optimization): harness/headroom.md
      - VM Tests: harness/vm-tests.md
  - Services:
      - GitHub Self-Hosted Runners: services/github-runner.md
  - Whisper Dictation:
      - Overview: whisper-dictation/index.md
  - OpenShell:
      - Overview: openshell/index.md
      - Code-Sandbox (Lifecycle CLI): openshell/code-sandbox.md
      - Code-Agent Image (User Guide): openshell/code-agent-image.md
  - Minecraft:
      - Overview: minecraft/index.md
      - mc.andrewlee.fun: minecraft/mc-andrewlee-fun.md

plugins:
  - glightbox
  #- info # only useful for debugging
  - offline
  - search
  - tags

markdown_extensions:
  - attr_list

theme:
  font: false

  language: en

  name: material
  favicon: assets/brand/andrewthomaslee-transparent-logo.png

  icon:
    repo: fontawesome/brands/github

  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: grey
      accent: blue
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to system preference