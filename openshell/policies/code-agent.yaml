# GENERATED TEMPLATE — never consume this file directly and never
# hand-write store paths. The @bin_*@ placeholders are rendered by the
# flake (packages.code-agent-policy, flake-parts/openshellConfig.nix)
# with the EXACT store paths of the image's own package set
# (flake-parts/ociImages/code-agent.nix), so the image and the gateway
# config can never disagree about which binary may call which host.
# Lifecycle: `code-sandbox sync` drift-checks and pushes; `code-sandbox
# doctor` reports read-only. Both run as part of `code-sandbox create`.
#
# Sandbox policy for the code-agent image (general coding sandbox,
# flake-parts/ociImages/code-agent.nix): nix runtime package adds via
# substitution (cache.nixos.org, other *.nixos.org infra such as
# releases/channels/tarballs, clan-core's niks3 cache
# cache.geninf.io/cache.clan.lol, any *.cachix.org cache), public
# GitHub over HTTPS (git clone/fetch, curl downloads), read-write
# git+HTTPS to the
# fleet's gitea (git.clan.lol — clan flake inputs and agent push work),
# and the VSCodium server bootstrap fallback (only hit when the
# pre-baked server commit no longer matches the client's VSCodium).
# Attach providers for private repos or credentials.
#
#   code-sandbox create              (renders this file from the flake)
# or, manually:
#   openshell sandbox create --name code --from code-agent:<hash> \
#     --policy "$(nix build .#code-agent-policy --no-link --print-out-paths)" \
#     --cpu 4 --memory 8Gi -- bash -l
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /bin
    - /usr
    - /lib
    - /lib64
    - /etc
    # Baked agent material (repo skills/references, see /opt/skills).
    - /opt
    - /proc
    - /dev
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /nix
    - /home
    - /dev/null
    # nix opens a pseudoterminal master for build output; interactive
    # sessions need it too.
    - /dev/ptmx
    - /dev/pts

landlock:
  compatibility: best_effort

network_policies:
  # Binary cache substitution for `nix profile install` / nix builds.
  nix_store:
    name: nix_store
    endpoints:
      - { host: cache.nixos.org, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
    binaries:
      - { path: @bin_nix@ }

  # Other *.nixos.org infrastructure, read-only: source and channel
  # tarballs (releases.nixos.org serves nixpkgs nixexprs.tar.xz — the
  # exact fetch a tarball-pinned nixpkgs input like clan-core's makes),
  # the channel redirector (channels.nixos.org), fixed-output fetch
  # mirrors (tarballs.nixos.org), and Hydra build/cache reads
  # (hydra.nixos.org). cache.nixos.org has its own nix_store entry
  # above; this wildcard covers the rest of the nixos.org estate,
  # including the apex domain.
  nixos_org:
    name: nixos_org
    endpoints:
      - { host: nixos.org, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
      - { host: "*.nixos.org", port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
    binaries:
      - { path: @bin_nix@ }
      - { path: @bin_git@ }

  # Optional extra binary caches — deliberately OFF. Uncomment one when
  # an agent actually builds that stack; find out via the DENIED lines
  # in `openshell logs <name> --tail --source sandbox`. Until then these
  # hosts stay unreachable on purpose.
  # iog_cache:
  #   name: iog_cache
  #   endpoints:
  #     - { host: cache.iog.io, port: 443, protocol: rest,
  #         enforcement: enforce, access: read-only }
  #   binaries:
  #     - { path: @bin_nix@ }
  #
  # zw3rk_cache:
  #   name: zw3rk_cache
  #   endpoints:
  #     - { host: cache.zw3rk.com, port: 443, protocol: rest,
  #         enforcement: enforce, access: read-only }
  #   binaries:
  #     - { path: @bin_nix@ }

  # Cachix binary caches: one hostname per cache (<name>.cachix.org) —
  # the wildcard covers nix-community.cachix.org (nix-community
  # packages not on cache.nixos.org), devenv.cachix.org, and any cache
  # an agent configures at runtime. The repo's own caches (openshell —
  # this flake's closure — plus devenv, nix-community, chaotic-nyx,
  # mirroring flake.nix's nixConfig) are baked into the image
  # NIX_CONFIG as substituters + trusted keys; any other cache works at
  # runtime once named in NIX_CONFIG (extra-substituters +
  # extra-trusted-public-keys), e.g.
  #   NIX_CONFIG="$NIX_CONFIG extra-substituters = https://nix-community.cachix.org \
  #     extra-trusted-public-keys = nix-community.cachix.org-1:…" nix profile install nix-community#…
  cachix:
    name: cachix
    endpoints:
      - { host: "*.cachix.org", port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
    binaries:
      - { path: @bin_nix@ }

  # clan-core's niks3 binary cache (served as cache.geninf.io, also
  # answering as cache.clan.lol; objects may be signed under either
  # public key). Its substituter + both keys are baked into the image
  # NIX_CONFIG.
  clan_cache:
    name: clan_cache
    endpoints:
      - { host: cache.geninf.io, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
      - { host: cache.clan.lol, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
    binaries:
      - { path: @bin_nix@ }

  # FlakeHub api hosts for flakehub: inputs (moscripts is one). The
  # lock's tarball URLs point at api.flakehub.com; api.flakehub.io is
  # the resolver. nix fetchers run as the nix binary. The
  # cache.flakehub.com/edge.cache.flakehub.com binary caches were
  # REMOVED from the image NIX_CONFIG — they answer nix-cache-info with
  # 401 Unauthorized anonymously, so they were dead substituters adding
  # warning noise to every nix invocation — and their egress went with
  # them.
  flakehub:
    name: flakehub
    endpoints:
      - { host: api.flakehub.io, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
      - { host: api.flakehub.com, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
    binaries:
      - { path: @bin_nix@ }

  # Public GitHub: smart-HTTP clone/fetch (git + curl + nix fetchers).
  # Pushing to private repos rides an attached github provider instead.
  # The POST rule MUST be "/**/git-upload-pack" — OpenShell matches rule
  # paths as globs where '>' is a LITERAL, so the earlier "/>/…" form
  # matched nothing and silently depended on the attached provider's own
  # git-transport rules (provider-less sandboxes failed clone at the
  # POST). Upstream regression-tests this exact rule set as #1769.
  github:
    name: github
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "**"
          - allow:
              method: HEAD
              path: "**"
          - allow:
              method: OPTIONS
              path: "**"
          - allow:
              method: POST
              path: "/**/git-upload-pack"
      - host: codeload.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      # Raw file and gist serving hosts: agents curl upstream docs,
      # install scripts and single files from
      # raw.githubusercontent.com/<org>/<repo>/<ref>/<path>; gists ride
      # gist.githubusercontent.com. Same read-only posture as codeload.
      - host: raw.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: gist.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: @bin_nix@ }
      - { path: @bin_git@ }
      - { path: @bin_curl@ }

  # git.clan.lol (Gitea): clan flake inputs and repos — this fleet's
  # own gitea, so unlike github.com it gets read-write git transport
  # (git-receive-pack) for agent push work. Smart-HTTP git is GET
  # info/refs + POST git-upload-pack / git-receive-pack; nix fetches
  # git+https inputs through its git binary. No provider credential is
  # bound to this host.
  gitea:
    name: gitea
    endpoints:
      - host: git.clan.lol
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "**"
          - allow:
              method: HEAD
              path: "**"
          - allow:
              method: OPTIONS
              path: "**"
          - allow:
              method: POST
              path: "/**/git-upload-pack"
          - allow:
              method: POST
              path: "/**/git-receive-pack"
    binaries:
      - { path: @bin_nix@ }
      - { path: @bin_git@ }
      - { path: @bin_curl@ }

  # Kimi for Coding subscription endpoint (api.kimi.com/coding,
  # Anthropic-compatible): pi's built-in kimi-coding provider (key via
  # the attached kimi-for-coding provider, $KIMI_API_KEY injected) and
  # the kimi-code CLI. The supervisor matches resolved exes: pi is a
  # standalone ELF (libexec/pi/pi), kimi-code runs on node.
  kimi_for_coding:
    name: kimi_for_coding
    endpoints:
      - { host: api.kimi.com, port: 443, protocol: rest,
          enforcement: enforce, access: read-write }
    binaries:
      - { path: @bin_pi@ }
      # kimi-code's node comes from the llm-agents input's OWN nixpkgs
      # closure, not this flake's pkgs.nodejs — an exact path here
      # could silently deny kimi egress after an input bump, so this
      # pin stays a wildcard on purpose.
      - { path: /nix/store/*-nodejs*/bin/node }

  # Claude Code against api.anthropic.com with a Claude Teams
  # subscription bearer token (injected as $ANTHROPIC_AUTH_TOKEN by
  # the attached claude-code provider). Claude's startup preflight
  # ("Checking connectivity..." → /v1/oauth/hello) and `claude auth
  # login` OAuth token polling both go to platform.claude.com — without
  # it claude exits with "Unable to connect to Anthropic services"
  # before showing a prompt. Updater/telemetry traffic is disabled in
  # the image env instead of admitted here.
  claude_code:
    name: claude_code
    endpoints:
      - { host: api.anthropic.com, port: 443, protocol: rest,
          enforcement: enforce, access: read-write }
      - host: platform.claude.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "**"
          - allow:
              method: HEAD
              path: "**"
          - allow:
              method: OPTIONS
              path: "**"
          - allow:
              method: POST
              path: "/v1/oauth/**"
    binaries:
      # The supervisor matches /proc/pid/exe: for wrapped packages that
      # is the wrapped ELF (`.claude-wrapped`, likewise gh below), so
      # both the wrapper and the real exe are pinned.
      - { path: @bin_claude_wrapped@ }
      - { path: @bin_claude@ }
      # headroom (context compression, baked as the agents' MCP server)
      # posts to api.anthropic.com with the claude provider's token;
      # its wrapper execs the slim binary, so pin the kernel-resolved
      # exe here too — without this, headroom_compress is denied.
      - { path: @bin_headroom@ }

  # Python package fetching: PyPI index + wheel CDN, read-only, for the
  # image's python3 and uv. pip runs in-process (`python3 -m pip`, also
  # inside a venv), so its connections carry the INTERPRETER's exe —
  # nixpkgs' bin/python3 is a symlink to the versioned binary, and the
  # resolved exe is pinned alongside it (same pattern as gh/.gh-wrapped
  # above). Wheel-only installs are the intended path: the image ships
  # no C toolchain, so sdists that compile cannot build in-sandbox —
  # route those through nix substitution. Uploads (twine et al.) are
  # deliberately NOT admitted.
  python_packages:
    name: python_packages
    endpoints:
      - { host: pypi.org, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
      - { host: files.pythonhosted.org, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
      # `uv python install` pulls CPython builds from GitHub release
      # assets (the release URL 302-redirects to these CDNs); admission
      # is per (binary, host), so uv needs its own pairs even though
      # curl/git/nix reach github.com in other entries.
      - { host: github.com, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
      - { host: objects.githubusercontent.com, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
      - { host: release-assets.githubusercontent.com, port: 443,
          protocol: rest, enforcement: enforce, access: read-only }
    binaries:
      - { path: @bin_python3@ }
      - { path: @bin_python3_real@ }
      - { path: @bin_uv@ }
      # The home flake's headroom input is a files.pythonhosted.org
      # wheel URL — flake INPUT fetches run as the nix binary, not
      # python/uv (learned 2026-10: fetchTree is lazy, so only evals
      # that reference the input hit this — which is why the lint gate
      # passed while `nix build .#code-agent-policy` was refused).
      - { path: @bin_nix@ }

  # Go module + toolchain fetches (the image bakes pkgs.go): the module
  # proxy serves version lists, .mod/.zip payloads and the
  # golang.org/toolchain modules GOTOOLCHAIN=auto downloads;
  # sum.golang.org is the checksum db (GOSUMDB). Read-only; Go module
  # publishing is not a sandbox workflow. Direct-VCS fallback
  # (GOPROXY=direct, or GONOSUMDB/GOPRIVATE paths) reuses git's
  # github.com / git.clan.lol / code.m3ta.dev admissions above — no
  # extra hosts needed here.
  golang:
    name: golang
    endpoints:
      - { host: proxy.golang.org, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
      - { host: sum.golang.org, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
      # The module proxy serves large payloads (toolchain zips for
      # GOTOOLCHAIN=auto, some module zips) via signed-URL redirects to
      # its GCS backend — same redirect class as github.com's
      # release-assets.githubusercontent.com (verified live 2026-10:
      # GOTOOLCHAIN=go1.25.0 download denied at storage.googleapis.com).
      - { host: storage.googleapis.com, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
    binaries:
      - { path: @bin_go@ }
      # go also runs INSIDE nix builders (go-modules fixed-output
      # derivations — e.g. nix2container's own build when the image is
      # rebuilt in-sandbox): that go comes from whatever nixpkgs the
      # built flake pins, not this image's pkgs.go, so an exact pin
      # would silently deny those builds after an input bump. Wildcard,
      # same rationale as the kimi nodejs pin below. nixpkgs' bin/go is
      # a symlink to share/go/bin/go and the supervisor matches the
      # RESOLVED exe, so pin the share/ layout too (verified: both this
      # flake's pkgs.go and nixpkgs#go resolve there).
      - { path: /nix/store/*-go-*/bin/go }
      - { path: /nix/store/*-go-*/share/go/bin/go }

  # mcp-nixos (the baked nixos MCP server): package/option `info`
  # queries answer from its local index, but `search`-family queries
  # call the search.nixos.org backend — admit it for the server's
  # binary only.
  nixos_search:
    name: nixos_search
    endpoints:
      - { host: search.nixos.org, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
    binaries:
      - { path: @bin_mcp_nixos@ }

  # code.m3ta.dev (Gitea): the home flake's `agents` input
  # (git+https://code.m3ta.dev/m3tam3re/AGENTS — the shared skill-tree
  # helper). Read-only smart-HTTP for nix input fetches and agent
  # clones; pushing there is not a sandbox workflow.
  m3ta:
    name: m3ta
    endpoints:
      - host: code.m3ta.dev
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "**"
          - allow:
              method: HEAD
              path: "**"
          - allow:
              method: OPTIONS
              path: "**"
          - allow:
              method: POST
              path: "/**/git-upload-pack"
    binaries:
      - { path: @bin_nix@ }
      - { path: @bin_git@ }

  # VSCodium Remote-SSH bootstrap fallback (jeanp413 open-remote-ssh):
  # only reached when the pre-baked server commit does not match the
  # client. The release URL 302-redirects to GitHub's asset CDNs
  # (objects.githubusercontent.com is the classic host; GitHub now also
  # serves assets from release-assets.githubusercontent.com).
  vscodium_server:
    name: vscodium_server
    endpoints:
      - { host: github.com, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
      - { host: objects.githubusercontent.com, port: 443, protocol: rest,
          enforcement: enforce, access: read-only }
      - { host: release-assets.githubusercontent.com, port: 443,
          protocol: rest, enforcement: enforce, access: read-only }
    binaries:
      - { path: @bin_curl@ }
