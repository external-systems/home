# Custom OpenShell provider profile: Moonshot AI "Kimi for Coding"
# (the api.kimi.com/coding subscription endpoint — it answers BOTH
# wires: Anthropic /coding/v1/messages and OpenAI
# /coding/v1/chat/completions).
#
# The code-agent image pre-wires BOTH consumers of this endpoint, so no
# interactive login is ever needed inside a sandbox — both route through
# the sandbox's single dual-pipeline headroom proxy (127.0.0.1:8787):
#  - pi via the baked ~/.pi/agent/models.json (built-in kimi-coding
#    provider, Anthropic wire, key from $KIMI_API_KEY, per-request
#    x-headroom-base-url: https://api.kimi.com/coding override);
#  - kimi-code via the baked ~/.kimi-code/config.toml (type = "kimi" —
#    Moonshot's NATIVE kimi-code wire, OpenAI-style /chat/completions at
#    the proxy's OpenAI pipeline, upstream api.kimi.com/coding/v1;
#    apiKeyEnv KIMI_API_KEY).
# kimi-code's OAuth login flow (auth.kimi.com / auth.kimi.ai) stays
# unreachable under the sandbox policy on purpose: credentials come from
# this provider, not an interactive device-code flow.
#
# There is no built-in profile for this endpoint, so this one is modeled
# directly on the built-in `github` profile (see `openshell profile export
# github --output yaml`). Import once per gateway, then create a provider
# bound to the endpoint:
#
#   export KIMI_API_KEY=$(jq -r '."kimi-coding".key' ~/.pi/agent/auth.json)
#   openshell profile import --file openshell/profiles/kimi-for-coding.yaml
#   openshell provider create --name kimi-for-coding --type kimi-for-coding \
#     --credential KIMI_API_KEY    # bare KEY reads the value from the env
id: kimi-for-coding
resource_version: 1
display_name: Kimi for Coding
description: Moonshot AI Kimi coding endpoint (api.kimi.com — Anthropic-wire /coding/v1/messages + OpenAI-wire /coding/v1/chat/completions)
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: Kimi for Coding API key
    env_vars:
      - KIMI_API_KEY
    required: true
    auth_style: bearer
    header_name: authorization
    query_param: ""
endpoints:
  - host: api.kimi.com
    port: 443
    protocol: rest
    # pi streams POST /coding/v1/messages, kimi-code streams POST
    # /coding/v1/chat/completions; read-write covers POST/PUT/PATCH
    # and still blocks DELETE.
    access: read-write
    enforcement: enforce
binaries:
  # Resolved process images (the supervisor matches /proc/<pid>/exe, not
  # the PATH wrapper):
  #  - pi (llm-agents package `pi`) is a bun-compiled standalone ELF at
  #    libexec/pi/pi (bin/pi is just a wrapper)
  #  - kimi-code (bin/kimi) runs on node
  - /nix/store/*-pi-*/libexec/pi/pi
  - /nix/store/*-nodejs*/bin/node
discovery:
  credentials:
    - api_key
