name: Release
# FlakeHub-style rolling semver: 0.<rolling-minor>.<commit-count>.
# ORG RULE: every push to main is auto-tagged AFTER nix flake check
# passes (check-and-tag job — the org's reusable workflow ships the
# gate); publishing the GitHub release is manual (workflow_dispatch →
# release job, pre-flight flake check included). Adjust ROLLING_MINOR
# when the repo rolls minor.
permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish as a GitHub release (default: latest)"
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  ROLLING_MINOR: "1"

jobs:
  check-and-tag:
    if: github.event_name == 'push'
    uses: external-systems/actions/.github/workflows/nix-flake-check-and-tag.yml@v1
    with:
      rolling-minor: ${{ env.ROLLING_MINOR }}

  release:
    # Stays repo-local: gh release + --latest semantics are per-repo
    # policy, not part of the reusable set.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, external-systems]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Pre-flight Flake Check
        run: nix flake check --show-trace -L

      - name: Resolve tag
        id: semver
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git tag -l "0.${ROLLING_MINOR}.*" --sort=-version:refname | head -1)
          fi
          [ -n "$TAG" ] || { echo "No 0.${ROLLING_MINOR}.* tag found." >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing: $TAG"

      - name: Create GitHub release
        run: gh release create "${{ steps.semver.outputs.tag }}" --title "${{ steps.semver.outputs.tag }}" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
