name: VM Tests
# NixOS VM tests for a repo that exposes them as checks
# (.#checks.x86_64-linux.<name>, built with nixosLib.runTest). KVM is
# available on the org runners — the driver runs inside the nix build
# sandbox and -L streams the complete driver log into the job log.
#
# ORG RULES: VM tests are workflow_dispatch ONLY — never automatic.
# Resource caps (runner: kamrui-h1, 30 GiB RAM / 8c16t): per-VM
# memorySize <= 16384 MiB, cores <= 8; undeclared = safe nixosTest
# defaults (1024 MiB, 1 core). Enforce with a grep-based check in the
# repo's flake checks (see checks.vm-test-resources in the home flake).
permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  list:
    # Dynamic matrix: every check whose name starts with "vmtest-"
    # (adopt whatever naming prefix the repo uses for its VM tests).
    runs-on: [self-hosted, external-systems]
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v6.0.2
      - id: list
        run: |
          tests=$(nix eval --json .#checks.x86_64-linux --apply 'builtins.attrNames' \
            | jq -c 'map(select(startswith("vmtest-"))) | sort')
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  test:
    needs: list
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.list.outputs.tests) }}
    runs-on: [self-hosted, external-systems]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6.0.2
      - run: nix build .#checks.x86_64-linux.${{ matrix.test }} -L
